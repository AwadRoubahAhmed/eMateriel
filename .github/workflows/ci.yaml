# nom du flux de travail / workflow
name: emateriel ci workflow

# déclenchement du workflow
on: 
  # déclenchement lorsqu'une branche est modifiée 
  push:
    branches: [master]

# travaux / jobs / taches
jobs:

  # nom de la tache
  CI: 
    # choix de l'OS
    runs-on: ubuntu-latest

    # étapes de la tache
    steps:
      - name: Cloner le repository
        uses: actions/checkout@v4

      - name: Créer le fichier d'environnement de test
        working-directory: code
        run: cp .env.test.example .env.test

      - name: Installer les dépendances
        working-directory: code
        run: npm ci
      
      - name: Compiler le projet React
        working-directory: code
        run: npm run build

      - name: Démarrer MYSQL et importer la base de données de tests
        working-directory: code/mysql
        run: |
          sudo service mysql start
          mysql -uroot -proot -e "CREATE DATABASE emateriel_test;"
          mysql -uroot -proot emateriel_test < emateriel.test.sql
          mysql -uroot -proot emateriel_test < insert.test.sql 
          mysql -uroot -proot -e "SHOW DATABASES;"
      
      - name: Exécuter les tests
        working-directory: code
        run: npm run test