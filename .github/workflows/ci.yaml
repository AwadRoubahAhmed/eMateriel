name: emateriel ci workflow

on:
  push:
    branches: [master]
  pull_request:

jobs:
  CI:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code

    steps:
      - name: Cloner le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: code/package-lock.json

      - name: Créer le fichier d'environnement de test
        run: cp .env.test.example .env.test

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les types TypeScript
        run: npm run typecheck

      - name: Compiler le site
        run: npm run build
        env:
          VITE_SITE_URL: https://example.com

      # MySQL est préinstallé sur le runner (root / root) ; la base de test
      # est recréée automatiquement par tests/global-setup.ts
      - name: Démarrer MySQL
        run: sudo systemctl start mysql.service

      - name: Exécuter les tests de l'API
        run: npm test
