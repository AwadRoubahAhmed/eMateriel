# nom du flux de travail / workflow
name: emateriel ci workflow

# déclenchement du workflow
on: 
    # déclenchement lorsqu'une branche est modifiée 
    push:
        branches: [master]

# travaux / jobs / taches
jobs:

    # nom de la tache
    CI: 
        # choix de l'OS
        runs-on: unbuntu-latest

        # étapes de la tache
        steps:
            -
                name: Cloner le repository
                uses: actions/checkout@v6 

            -
                name: Installer les dépendances
                working-directory: code
                run: npm ci
            
            -
                name: Compiler le projet React
                working-directory: code
                run: npm build

            -
                name: Démarer MYSQL et importer la base de donées de tests
                working-directory: code
                run: |
                  sudo service msql start
                  mysql -uroot -proot -e "source emateriel.test.sql;"
                  mysql -uroot -proot -e "insert.test.sql;"
                  mysql -uroot -proot -e "show databases;"

            
             -
                name: Exécuter les tests
                working-directory: code
                run: npm run test

