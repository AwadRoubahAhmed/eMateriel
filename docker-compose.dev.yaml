services:
  mysql:
    image: mysql:9.5
    ports:
      - 3306:3306
    volumes:
      - ./code/mysql:/app
      - ./mysql-data:/var/lib/mysql
    working_dir: /app
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root

  node:
    image: node:25
    ports:
      - 5000:5000 # liveserver
      - 5173:5173 # vite
      - 3000:3000 # API
    volumes:
      - ./code:/app
    tty: true
    working_dir: /app
    restart: always
    command: sh -c "npm install && npm run dev"

  mongodb:
    image: mongo:8.2
    ports:
      - 27017:27017
    volumes:
      - ./code/mongodb:/app 
      - ./mongodb-data:/data/db
    # si mongoDB redémarre en permanence, changer le dossier cible
    # - ./mongodb-data:/data
    working_dir: /app
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    restart: always
