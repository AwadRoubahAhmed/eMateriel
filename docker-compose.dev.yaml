# Environnement de développement Docker (optionnel).
# Dans le conteneur node, utiliser MYSQL_HOST=mysql dans .env.development.
services:
  mysql:
    image: mysql:8.4
    ports:
      - 3306:3306
    volumes:
      - ./code/mysql:/app
      - ./mysql-data:/var/lib/mysql
    working_dir: /app
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root

  node:
    image: node:22
    ports:
      - 3000:3000
    volumes:
      - ./code:/app
    tty: true
    working_dir: /app
    restart: always
